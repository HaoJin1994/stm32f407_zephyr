 
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_CLOCK_CONTROL=y
CONFIG_CONSOLE=y
#CONFIG_ARMV8_A_NS=y
#CONFIG_ARM64_VA_BITS_36=y
#CONFIG_ARM64_PA_BITS_36=y
CONFIG_UART_CONSOLE=y

CONFIG_LOG=y
#CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_MODE_DEFERRED=y
#CONFIG_LOG_RUNTIME_FILTERING=y  #运行时动态过滤
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_PRINTK=y
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=0
CONFIG_COVERAGE=n
CONFIG_LOG_TAG_MAX_LEN=8
CONFIG_LOG_CMDS=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_IMMEDIATE=y

# 启用 Shell
CONFIG_SHELL=y

# 启用串口后端
CONFIG_SHELL_BACKEND_SERIAL=y

# 配置 Shell 缓冲区大小
CONFIG_SHELL_CMD_BUFF_SIZE=256

# 启用命令历史
CONFIG_SHELL_HISTORY=y
CONFIG_SHELL_HISTORY_BUFFER=512

# 启用 Tab 自动补全
CONFIG_SHELL_TAB=y
CONFIG_SHELL_TAB_AUTOCOMPLETION=y

# 启用 VT100 颜色
CONFIG_SHELL_VT100_COLORS=y


CONFIG_PRINTK=y


# Flash 驱动基础
CONFIG_FLASH=y
# Flash Map 抽象模块（提供 flash_area API）
CONFIG_FLASH_MAP=y
# Flash 页布局支持
CONFIG_FLASH_PAGE_LAYOUT=y


#littleFS
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_SHELL=y

# 配置 LittleFS 参数
CONFIG_FS_LITTLEFS_NUM_FILES=4
CONFIG_FS_LITTLEFS_NUM_DIRS=4
CONFIG_FS_LITTLEFS_CACHE_SIZE=256

CONFIG_MAIN_STACK_SIZE=3072


# 启用日志的 LittleFS 后端
#CONFIG_LOG_BACKEND_FS=y
# 挂载点，需 littlefs 挂载点一致
#CONFIG_LOG_BACKEND_FS_DIR="/lfs"
# 单个日志文件的最大大小（字节）
#CONFIG_LOG_BACKEND_FS_FILE_SIZE=4096
# 保留的最大日志文件数量（超出后会覆盖最旧的）
#CONFIG_LOG_BACKEND_FS_FILES_LIMIT=3

# 推荐：为日志处理线程增加栈空间，避免溢出
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096

#监控线程运行时间
#CONFIG_THREAD_MONITOR=y
#CONFIG_SCHED_THREAD_USAGE=y
#CONFIG_THREAD_RUNTIME_STATS=y


CONFIG_STREAM_FLASH=y
CONFIG_POSIX_API=y

